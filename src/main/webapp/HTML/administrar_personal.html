<!DOCTYPE html>
<html>
    <head>
        <title>Administrar personal | One More Dish</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <link rel="stylesheet" href="../ESTILOS/general.css"/>
        <link rel="stylesheet" href="../ESTILOS/inicio.css"/>  
    </head>
    <body>
        <h1>Administrar personal</h1>
        <section>
            <div>
                <h2>Datos del personal</h2>
                <hr>
                <form action="../Buscar_Personal_Nombre" method="post">
                <label>Nombre: </label>
                <input type="text" name="nombre"/>
                <input type="submit" value="Buscar" name="buscar" /><br>
                </form>
                
                <label>Puesto: </label>
                <select name="puestos" disabled>
                    <option value="mesero">Mesero</option>
                    <option value="cocinero">Cocinero</option>
                    <option value="supervisor">Supervisor</option>
                </select><br>
                
                <label>Horario: </label>
                <input type="time" name="horario_entrada" disabled/> - 
                <input type="time" name="horario_salida" disabled/>
            </div>

            <button name="eliminar">Eliminar</button>
            <button name="actualizar">Actualizar</button>
            <button name="añadir">Añadir</button>
        </section>
        <script src="../JS/header_admin.js"></script>
    </body>
</html>
