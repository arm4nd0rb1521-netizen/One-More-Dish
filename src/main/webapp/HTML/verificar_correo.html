<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verificar correo | One More Dish</title>
</head>
<body>
    <h1>Verifica tu correo</h1>

    <p>Te enviamos un código de seis dígitos.</p>

    <form action="../Verificar_Correo_Servlet" method="POST">

        <label for="codigo">Código de verificación:</label><br>
        <input type="text" id="codigo" name="codigo" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><br><br>

        <button type="submit">Verificar</button>
    </form>
</body>
</html>
