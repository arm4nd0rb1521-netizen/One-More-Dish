<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos a domicilio · Entregas</title>

    <!-- Tipografías editoriales y limpias -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tus estilos -->
    <link rel="stylesheet" href="../ESTILOS/general.css"/>
    <link rel="stylesheet" href="../ESTILOS/inicio.css"/>
    <link rel="stylesheet" href="../ESTILOS/admin.css"/>
    <link rel="stylesheet" href="../ESTILOS/domicilio.css"/>
</head>
<body>

    <div class="delivery-page">
        <div class="delivery-container">

            <!-- Banner Superior -->
            <header class="delivery-banner">
                <div class="delivery-banner-text">
                    <span class="delivery-kicker">ENTREGAS</span>
                    <h1 class="delivery-title">Pedidos a domicilio</h1>
                    <p class="delivery-subtitle">Da seguimiento a cada pedido, de la cocina a la puerta.</p>
                    <span id="indicador_vivo" class="indicador_vivo">Conectando…</span>
                </div>

                <div class="delivery-banner-art">
                    <div class="delivery-arch-icon" aria-hidden="true">
                        <span class="arch-sun"></span>
                        <span class="arch-dot"></span>
                    </div>
                </div>
            </header>

            <!-- Aviso (nuevo pedido, errores) -->
            <p id="aviso" class="delivery-aviso" hidden></p>

            <!-- Barra de Filtros -->
            <nav class="delivery-filters" aria-label="Filtrar pedidos por estado">
                <button type="button" class="filter-pill active" data-filter="todos">Todos</button>
                <button type="button" class="filter-pill" data-filter="pendiente">Pendientes</button>
                <button type="button" class="filter-pill" data-filter="preparacion">En preparación</button>
                <button type="button" class="filter-pill" data-filter="listo">Listos</button>
                <button type="button" class="filter-pill" data-filter="camino">En camino</button>
                <button type="button" class="filter-pill" data-filter="entregado">Entregados</button>
                <button type="button" class="filter-pill" data-filter="cancelado">Cancelados</button>
            </nav>

            <!-- Lista de Pedidos -->
            <section class="delivery-list" id="lista-pedidos">
                <div class="empty-pedidos">Cargando pedidos…</div>
            </section>

        </div>
    </div>

    <!-- Modal de detalle y cambio de estado -->
    <div class="pedido-modal-overlay" id="pedido-modal" aria-hidden="true">
        <div class="pedido-modal-box">
            <button type="button" class="pedido-modal-close" id="cerrar-pedido-modal" aria-label="Cerrar">&times;</button>
            <span class="pedido-modal-code" id="modal-codigo">Pedido</span>
            <h2 class="pedido-modal-cliente" id="modal-cliente"></h2>
            <p class="pedido-modal-fecha" id="modal-fecha"></p>
            <p class="pedido-modal-fecha" id="modal-direccion"></p>

            <div class="pedido-modal-items" id="modal-items"></div>

            <div class="pedido-modal-estado-group">
                <label for="modal-select-estado">Actualizar estado:</label>
                <select id="modal-select-estado">
                    <option value="pendiente">Pendiente</option>
                    <option value="preparacion">En preparación</option>
                    <option value="listo">Listo</option>
                    <option value="camino">En camino</option>
                    <option value="entregado">Entregado</option>
                    <option value="cancelado">Cancelado</option>
                </select>
            </div>

            <p class="pedido-modal-error" id="modal-error" hidden></p>

            <div class="pedido-modal-footer">
                <span class="pedido-modal-total" id="modal-total">$ 0.00</span>
                <button type="button" class="btn-guardar-pedido" id="guardar-pedido-btn">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Scripts del proyecto -->
    <script src="../JS/header_admin.js"></script>
    <script src="../JS/footer_admin.js"></script>
    <script src="../JS/socket_pedidos.js"></script>

    <!-- Lógica de filtros, detalle y tiempo real -->
    <script>
        (function () {
            const API = '../Pedidos_Domicilio_Servlet';

            // Texto guardado en la base  ->  clave corta para filtros y colores
            const CLAVES = {
                'pendiente': 'pendiente',
                'en preparacion': 'preparacion',
                'listo': 'listo',
                'en camino': 'camino',
                'entregado': 'entregado',
                'cancelado': 'cancelado'
            };

            let pedidos = [];
            let filtroActivo = 'todos';
            let pedidoSeleccionadoId = null;

            const listaPedidosEl = document.getElementById('lista-pedidos');
            const filterPills = document.querySelectorAll('.filter-pill');
            const modalOverlay = document.getElementById('pedido-modal');
            const cerrarModalBtn = document.getElementById('cerrar-pedido-modal');
            const selectEstado = document.getElementById('modal-select-estado');
            const guardarPedidoBtn = document.getElementById('guardar-pedido-btn');
            const modalError = document.getElementById('modal-error');
            const aviso = document.getElementById('aviso');
            const indicador = document.getElementById('indicador_vivo');

            // ----- Ayudas -----
            function el(tag, clase, texto) {
                const e = document.createElement(tag);
                if (clase) e.className = clase;
                if (texto !== undefined) e.textContent = texto;   // textContent: nunca inyecta HTML
                return e;
            }

            const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
            const clave = estado => CLAVES[norm(estado)] || 'pendiente';
            const dinero = n => '$ ' + Number(n || 0).toFixed(2);

            function fechaCorta(iso) {
                if (!iso) return 'Sin fecha';
                return new Date(iso).toLocaleString('es-MX',
                    { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
            }

            function mostrarAviso(texto, error) {
                aviso.textContent = texto;
                aviso.classList.toggle('error', !!error);
                aviso.hidden = false;
                clearTimeout(mostrarAviso.t);
                mostrarAviso.t = setTimeout(() => { aviso.hidden = true; }, 4000);
            }

            function irALogin() {
                location.href = '../HTML/signin.html';
            }

            function iconoBolsa() {
                const ns = 'http://www.w3.org/2000/svg';
                const svg = document.createElementNS(ns, 'svg');
                svg.setAttribute('viewBox', '0 0 24 24');
                svg.setAttribute('width', '18');
                svg.setAttribute('height', '18');
                svg.setAttribute('fill', 'none');
                svg.setAttribute('stroke', '#9e2a5c');
                svg.setAttribute('stroke-width', '1.8');
                svg.setAttribute('stroke-linecap', 'round');
                svg.setAttribute('stroke-linejoin', 'round');
                ['M6 7h12l-1 13H7L6 7z', 'M9 7V5a3 3 0 0 1 6 0v2'].forEach(d => {
                    const path = document.createElementNS(ns, 'path');
                    path.setAttribute('d', d);
                    svg.append(path);
                });
                return svg;
            }

            // ----- Lista -----
            function tarjeta(pedido, nuevo) {
                const card = el('article', 'pedido-card' + (nuevo ? ' recien-llegado' : ''));

                const izq = el('div', 'pedido-left');
                const icono = el('div', 'pedido-bag-icon');
                icono.setAttribute('aria-hidden', 'true');
                icono.append(iconoBolsa());
                const meta = el('div', 'pedido-meta');
                meta.append(
                    el('h2', 'pedido-codigo', 'Pedido #' + pedido.id),
                    el('p', 'pedido-subinfo', pedido.cliente + ' · ' + fechaCorta(pedido.fecha))
                );
                izq.append(icono, meta);

                const der = el('div', 'pedido-right');
                const badge = el('span', 'pedido-badge badge-' + clave(pedido.estado));
                badge.append(el('span', 'badge-dot'), document.createTextNode(' ' + (pedido.estado || 'Pendiente')));
                const ver = el('button', 'btn-ver-detalle', 'Ver pedido');
                ver.type = 'button';
                ver.addEventListener('click', () => abrirModalPedido(pedido.id));
                der.append(badge, el('span', 'pedido-monto', dinero(pedido.total)), ver);

                card.append(izq, der);
                return card;
            }

            function renderPedidos(idNuevo) {
                const filtrados = pedidos.filter(p => filtroActivo === 'todos' || clave(p.estado) === filtroActivo);

                if (filtrados.length === 0) {
                    listaPedidosEl.replaceChildren(el('div', 'empty-pedidos', 'No hay pedidos en esta categoría.'));
                    return;
                }
                listaPedidosEl.replaceChildren(...filtrados.map(p => tarjeta(p, p.id === idNuevo)));
            }

            function cargar() {
                return fetch(API)
                    .then(r => {
                        if (r.status === 401 || r.status === 403) { irALogin(); throw new Error(); }
                        if (!r.ok) throw new Error();
                        return r.json();
                    })
                    .then(datos => { pedidos = datos; renderPedidos(); })
                    .catch(() => {
                        listaPedidosEl.replaceChildren(el('div', 'empty-pedidos',
                            'No se pudieron cargar los pedidos. Revisa el servidor y la base de datos.'));
                    });
            }

            filterPills.forEach(pill => {
                pill.addEventListener('click', () => {
                    filtroActivo = pill.dataset.filter;
                    filterPills.forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                    renderPedidos();
                });
            });

            // ----- Modal -----
            async function abrirModalPedido(id) {
                try {
                    const r = await fetch(API + '?id=' + id);
                    if (r.status === 401 || r.status === 403) { irALogin(); return; }
                    if (!r.ok) throw new Error();
                    const d = await r.json();

                    pedidoSeleccionadoId = d.id;
                    document.getElementById('modal-codigo').textContent = 'Pedido #' + d.id;
                    document.getElementById('modal-cliente').textContent = d.cliente;
                    document.getElementById('modal-fecha').textContent =
                        fechaCorta(d.fecha) + ' · ' + (d.telefono || 'Sin teléfono');
                    document.getElementById('modal-direccion').textContent = d.direccion || 'Sin dirección';
                    document.getElementById('modal-total').textContent = dinero(d.total);
                    selectEstado.value = clave(d.estado);
                    modalError.hidden = true;
                    guardarPedidoBtn.disabled = false;

                    const items = d.platillos.length
                        ? d.platillos.map(p => el('div', 'modal-item-chip', p.cantidad + '× ' + p.nombre))
                        : [el('div', 'modal-item-chip', 'Sin platillos')];
                    document.getElementById('modal-items').replaceChildren(...items);

                    modalOverlay.classList.add('open');
                    modalOverlay.setAttribute('aria-hidden', 'false');
                } catch (e) {
                    mostrarAviso('No se pudo abrir el pedido.', true);
                }
            }

            function cerrarModalPedido() {
                modalOverlay.classList.remove('open');
                modalOverlay.setAttribute('aria-hidden', 'true');
                pedidoSeleccionadoId = null;
            }

            guardarPedidoBtn.addEventListener('click', async () => {
                if (pedidoSeleccionadoId === null) return;
                guardarPedidoBtn.disabled = true;
                modalError.hidden = true;

                try {
                    const r = await fetch(API, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                        body: new URLSearchParams({ id: pedidoSeleccionadoId, estado: selectEstado.value })
                    });
                    if (r.status === 401) { irALogin(); return; }
                    const j = await r.json();
                    if (!j.ok) throw new Error(j.mensaje || 'No se pudo guardar');

                    const p = pedidos.find(x => x.id === pedidoSeleccionadoId);
                    if (p) p.estado = j.estado;
                    mostrarAviso('Pedido #' + pedidoSeleccionadoId + ': ' + j.estado);
                    cerrarModalPedido();
                    renderPedidos();
                } catch (e) {
                    modalError.textContent = e.message;
                    modalError.hidden = false;
                    guardarPedidoBtn.disabled = false;
                }
            });

            cerrarModalBtn.addEventListener('click', cerrarModalPedido);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) cerrarModalPedido();
            });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModalPedido(); });

            // ----- Tiempo real -----
            function alMensaje(msg) {
                if (msg.tipo === 'pedido_nuevo' && msg.pedido) {
                    if (!pedidos.some(p => p.id === msg.pedido.id)) pedidos.unshift(msg.pedido);
                    renderPedidos(msg.pedido.id);
                    mostrarAviso('Nuevo pedido #' + msg.pedido.id + ' de ' + msg.pedido.cliente);
                }

                if (msg.tipo === 'pedido_estado') {
                    const p = pedidos.find(x => x.id === msg.id);
                    if (p) {
                        p.estado = msg.estado;
                        renderPedidos();
                    } else {
                        cargar();
                    }
                    // Si lo tenemos abierto, movemos el select al estado nuevo
                    if (pedidoSeleccionadoId === msg.id) selectEstado.value = clave(msg.estado);
                }
            }

            function pintarConexion(conectado) {
                indicador.textContent = conectado ? 'En vivo' : 'Reconectando…';
                indicador.classList.toggle('conectado', conectado);
            }

            cargar();

            Socket_Pedidos.conectar({
                alMensaje: alMensaje,
                alCambiarConexion: pintarConexion,
                respaldo: () => { if (pedidoSeleccionadoId === null) cargar(); },
                alSinSesion: irALogin
            });
        })();
    </script>
</body>
</html>
